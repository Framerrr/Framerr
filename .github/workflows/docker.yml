name: Build and Push Docker Images

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Beta / develop: :develop + :<package.json version>, channel=beta
      - name: Build and push (develop)
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            FRAMERR_CHANNEL=beta
          tags: |
            pickels23/framerr:develop
            pickels23/framerr:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prerelease tags (v0.4.0-beta.1, v0.4.0-rc.1, etc.) must NOT publish :latest.
      # GitHub pre-releases are for release notes; Docker betas come from the develop push above.
      - name: Skip production Docker for prerelease tags
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        run: |
          echo "Prerelease tag '${{ github.ref_name }}' — skipping :latest / stable channel."
          echo "Beta images are published from the develop branch push (:develop + :${{ steps.version.outputs.version }})."

      # Stable only: tag name has no hyphen (v0.4.0), channel=stable → :latest + :version
      - name: Build and push (production)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            FRAMERR_CHANNEL=stable
          tags: |
            pickels23/framerr:latest
            pickels23/framerr:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
